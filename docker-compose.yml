version: '3.8'

services:
  # ==========================================
  # Service 1: Main AvaRamp API
  # ==========================================
  avaramp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: avaramp-api
    restart: unless-stopped
    ports:
      - '${API_HOST_PORT:-3001}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - avaramp-network

  # ==========================================
  # Service 2: C-Chain Custodial Listener
  # Optional: omit this service and set CCHAIN_LISTENER_IN_API=true on
  # avaramp-api to run the deposit poll loop in-process (single instance only).
  # ==========================================
  cchain-listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
      target: production
    container_name: cchain-listener
    restart: unless-stopped
    command: ["npx", "tsx", "cchain-listener/src/index.ts"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - ./logs:/app/logs
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - avaramp-network

networks:
  avaramp-network:
    external: true
