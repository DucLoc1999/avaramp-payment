# Local stack: AvaRamp API (C-Chain deposit poll runs in-process via
# CCHAIN_LISTENER_IN_API=true; the standalone cchain-listener worker is omitted).
# Usage: docker compose -f docker-compose.local.yml up --build
#
# All services read .env.local.

services:
  # ==========================================
  # Service 1: Main AvaRamp API
  # ==========================================
  avaramp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: avaramp-api-local
    restart: unless-stopped
    ports:
      - '${API_HOST_PORT:-3001}:${PORT:-3000}'
    extra_hosts:
      # Let the in-container API reach the host's callback listener
      - 'host.docker.internal:host-gateway'
    env_file:
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      # GCP ADC for KMS signing (path inside the container, outside /app/data chown)
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-creds.json
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/loc/.config/gcloud/avaramp-kms-signer.json}:/app/gcp-creds.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - avaramp-network

networks:
  avaramp-network:
    external: true
